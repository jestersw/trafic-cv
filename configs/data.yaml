raw_root: data/raw/UA-DETRAC
out_root: data/processed/detrac

sources:
  - annotations: DETRAC-Train-Annotations-XML
    official_split: train
  - annotations: DETRAC-Test-Annotations-XML
    official_split: test

class_map:
  car: car
  bus: bus
  van: van
  others: others
classes: [car, bus, van, others]

split:
  strategy: official
  val_fraction: 0.15
  test_fraction: 0.2
  stratify_by: weather
  seed: 42

frame_step:
  train: 5
  val: 10
  test: 10

mask_ignored_regions: true

min_box_side: 4
