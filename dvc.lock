schema: '2.0'
stages:
  convert:
    cmd: python -m traffic_cv.data.convert --config configs/data.yaml
    deps:
    - path: data/raw/UA-DETRAC
      hash: md5
      md5: ef5c9089f2e461f5c64902bb8b823469.dir
      size: 10248708545
      nfiles: 140231
    - path: src/traffic_cv/data/convert.py
