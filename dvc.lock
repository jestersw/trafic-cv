      size: 9585
      nfiles: 5
    params:
      configs/train.yaml:
        base:
          model: yolo11s.pt
          data: data/processed/detrac/dataset.yaml
          epochs: 50
          imgsz: 640
          batch: 16
          patience: 15
          workers: 8
          seed: 42
          deterministic: true
          cos_lr: true
          project: runs/detect
          plots: true
        experiments.baseline:
          augmentations:
