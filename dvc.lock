    - path: src/traffic_cv/data/split.py
      hash: md5
      md5: ce9a2bb6db08054d1d8a5a0b7e7e1ba8
      size: 2070
    params:
      configs/data.yaml:
        class_map:
          car: car
          bus: bus
          van: van
          others: others
        classes:
        - car
        - bus
        - van
        - others
        frame_step:
          train: 5
          val: 10
          test: 10
        mask_ignored_regions: true
        min_box_side: 4
        out_root: data/processed/detrac
        raw_root: data/raw/UA-DETRAC
        sources:
        - annotations: DETRAC-Train-Annotations-XML
          official_split: train
        - annotations: DETRAC-Test-Annotations-XML
          official_split: test
        split:
          strategy: official
          val_fraction: 0.15
          test_fraction: 0.2
          stratify_by: weather
          seed: 42
    outs:
    - path: data/processed/detrac
      hash: md5
      md5: 0990f7d41212c356185c9b46a9cd4869.dir
      size: 2412111390
      nfiles: 42347
  eda:
    cmd: python -m traffic_cv.data.eda --data data/processed/detrac --out 
