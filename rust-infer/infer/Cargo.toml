[package]
name = "traffic-infer"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "traffic-infer"
path = "src/main.rs"

[features]
default = []
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml"]

[dependencies]
traffic-core = { path = "../core" }
ort = { version = "=2.0.0-rc.15", features = ["download-binaries"] }
opencv = { version = "0.101", default-features = false, features = ["imgproc", "videoio", "imgcodecs"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
